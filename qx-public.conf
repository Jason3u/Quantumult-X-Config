# ============================================================
#  Quantumult X 个人配置 —— v2
#
#  作者：Jason3u
#  更新：2026-08-14
#
#  【分流策略】
#    Apple 核心服务（App Store/iCloud/系统更新等） → 直连
#    Apple 外区内容（News/TV）                    → 代理（兜底分流）
#    AI 服务（ChatGPT/Gemini/Grok/Claude）        → AI选择（手动选地区，美国优先）
#    X（Twitter）                                → X平台（默认香港住宅IP，规避风控）
#    流媒体（YouTube/Netflix/Disney+/TikTok 等） → 流媒体选择（排除美国）
#    交易所（Binance/OKX/Bybit/Bitget/Gate）      → 交易所选择（默认香港住宅IP）
#    国内网站                                     → 直连
#    其余外网流量                                 → 兜底分流（手动切换）
#
#  【节点自动分组原理】
#    各地区策略组用 server-tag-regex 按节点名里的中文地区关键词
#    （如"美国""日本"）自动筛选机场订阅节点，无需手动整理；
#    地区内用 available（自动测速）选延迟最低的节点。
# ============================================================

[general]
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me
# 节点测速 URL（available 策略组据此选延迟最低的节点）
server_check_url = http://www.gstatic.com/generate_204

[dns]
# 国内域名用国内 DNS 解析，更快更稳
server = 223.5.5.5
server = 119.29.29.29
no-ipv6

[server_remote]
# 此处留空：机场订阅链接（含 token）不写入公开配置。
# 导入本配置后，在 QX 客户端「节点」里手动添加你的订阅即可。

[server_local]
# 此处留空：本地的单个节点可在此手动添加（格式见 QX 官方示例）。

[policy]
# ============================================================
# 策略组说明：
#   static    = 手动选择（你手动点选）
#   url-latency-benchmark = 自动测速，选延迟最低的节点（节点挂了自动换）
# ============================================================

# ---------- 兜底分流：所有未命中规则的外网流量最终出口（手动切换）----------
static = 兜底分流, 自动选择, AI选择, 美国节点, 日本节点, 新加坡节点, 英国节点, 韩国节点, 台湾节点, 香港节点, direct

# ---------- 自动选择：全局自动测速，从机场全部节点里选最快的 ----------
# 用 ^.+$ 匹配所有节点；不依赖订阅 tag，订阅后自动生效。
url-latency-benchmark = 自动选择, server-tag-regex=^.+$, check-interval=1200, tolerance=0

# ---------- AI选择：AI 分流手动选地区（规避 IP 跳变风控，默认美国优先）----------
# 说明：ChatGPT/Claude 对 IP 地理稳定性敏感，因此 AI 流量单独一个
#       手动选择组，你选定地区后，该地区内的节点才自动测速切换。
#       候选顺序即优先级：美国 > 日本 > 新加坡 > 英国 > 韩国 > 台湾
static = AI选择, 美国节点, 日本节点, 新加坡节点, 英国节点, 韩国节点, 台湾节点

# ---------- 各地区节点池：server-tag-regex 按节点名自动筛选 + available 自动测速 ----------
# server-tag-regex 会匹配节点名里含对应中文关键词的节点，自动归入该组。
url-latency-benchmark = 美国节点, server-tag-regex=美国, check-interval=1200, tolerance=0
url-latency-benchmark = 日本节点, server-tag-regex=日本, check-interval=1200, tolerance=0
url-latency-benchmark = 新加坡节点, server-tag-regex=新加坡, check-interval=1200, tolerance=0
url-latency-benchmark = 英国节点, server-tag-regex=英国, check-interval=1200, tolerance=0
url-latency-benchmark = 韩国节点, server-tag-regex=韩国, check-interval=1200, tolerance=0
url-latency-benchmark = 台湾节点, server-tag-regex=台湾, check-interval=1200, tolerance=0
url-latency-benchmark = 香港节点, server-tag-regex=香港, check-interval=1200, tolerance=0

# ---------- X（Twitter）平台：手动选地区（默认香港住宅IP，最不易被风控）----------
# 说明：X 风控重点看「IP 纯净度 + 位置稳定」，你机场里只有香港有住宅 IP 节点，
#       因此默认走「香港住宅IP」；其他地区分组作为备用，手动可切换。
#       候选顺序：香港住宅IP（默认）> 日本 > 新加坡 > 台湾 > 韩国 > 英国
static = X平台, 香港住宅IP, 日本节点, 新加坡节点, 台湾节点, 韩国节点, 英国节点

# ---------- 香港住宅IP：available 自动测速（X 专用，只含住宅节点，规避风控）----------
# server-tag-regex=住宅 匹配节点名含「住宅」的节点（即香港住宅IP/香港专线住宅节点）。
url-latency-benchmark = 香港住宅IP, server-tag-regex=住宅, check-interval=1200, tolerance=0

# ---------- 交易所：手动选地区（默认香港住宅IP，规避风控）----------
# 说明：交易所风控看「IP 纯净度 + KYC地区与IP地区一致性」，大陆身份用香港 IP 最自然。
#       因此默认「香港住宅IP」，与 X 共用住宅节点池；美国已排除（美国只给 AI）。
#       候选顺序：香港住宅IP（默认）> 香港 > 日本 > 新加坡 > 台湾 > 韩国
static = 交易所选择, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- 流媒体选择：手动选地区（排除美国，美国只给 AI 用）----------
# 说明：流媒体（Netflix/Disney+ 等）需要「流媒体解锁」节点，普通高速节点可能无法解锁。
#       因此流媒体单独用「流媒体」标记的节点；美国节点已排除，仅供 AI 使用。
#       候选顺序：日本 > 新加坡 > 英国 > 韩国 > 台湾
static = 流媒体选择, 日本流媒体, 新加坡流媒体, 英国流媒体, 韩国流媒体, 台湾流媒体

# ---------- 各地区流媒体节点池：server-tag-regex 匹配「地区+流媒体」标记的节点 ----------
# 节点名如「🇯🇵日本专线01|BGP|流媒体」，正则「地区.*流媒体」精确筛选流媒体解锁节点。
url-latency-benchmark = 日本流媒体, server-tag-regex=日本.*流媒体, check-interval=1200, tolerance=0
url-latency-benchmark = 新加坡流媒体, server-tag-regex=新加坡.*流媒体, check-interval=1200, tolerance=0
url-latency-benchmark = 英国流媒体, server-tag-regex=英国.*流媒体, check-interval=1200, tolerance=0
url-latency-benchmark = 韩国流媒体, server-tag-regex=韩国.*流媒体, check-interval=1200, tolerance=0
url-latency-benchmark = 台湾流媒体, server-tag-regex=台湾.*流媒体, check-interval=1200, tolerance=0

[filter_remote]
# ============================================================
# 远程分流规则（来源：blackmatrix7/ios_rule_script）
# 格式：URL, tag=标签, force-policy=强制策略组, enabled=是否启用
# ============================================================

# ---------- Apple 核心服务：直连 ----------
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Apple/Apple.list, tag=Apple, force-policy=direct, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/iCloud/iCloud.list, tag=iCloud, force-policy=direct, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/AppStore/AppStore.list, tag=AppStore, force-policy=direct, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/AppleMusic/AppleMusic.list, tag=AppleMusic, force-policy=direct, enabled=true

# ---------- Apple 外区内容：代理（大陆无法直连，走代理才能用外区账号）----------
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/AppleNews/AppleNews.list, tag=AppleNews, force-policy=兜底分流, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/AppleTV/AppleTV.list, tag=AppleTV, force-policy=兜底分流, enabled=true

# ---------- AI 服务：走 AI选择（手动选地区）----------
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI, force-policy=AI选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Gemini/Gemini.list, tag=Gemini, force-policy=AI选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Anthropic/Anthropic.list, tag=Anthropic, force-policy=AI选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Claude/Claude.list, tag=Claude, force-policy=AI选择, enabled=true

# ---------- 流媒体服务：走 流媒体选择（手动选地区，排除美国）----------
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=流媒体选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Netflix/Netflix.list, tag=Netflix, force-policy=流媒体选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Disney/Disney.list, tag=Disney, force-policy=流媒体选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/TikTok/TikTok.list, tag=TikTok, force-policy=流媒体选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Spotify/Spotify.list, tag=Spotify, force-policy=流媒体选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Twitch/Twitch.list, tag=Twitch, force-policy=流媒体选择, enabled=true

# ---------- 交易所：走 交易所选择（手动选地区，默认香港住宅IP）----------
# Binance、OKX 在 blackmatrix7 仓库有规则，直接引用
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/Binance/Binance.list, tag=Binance, force-policy=交易所选择, enabled=true
https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/QuantumultX/OKX/OKX.list, tag=OKX, force-policy=交易所选择, enabled=true
# Bybit、Bitget、Gate 在 blackmatrix7 仓库无规则，域名在下方 [filter_local] 手动补充

[filter_local]
# ============================================================
# 本地分流规则（从上到下匹配，顺序重要）
# ============================================================

# ---------- 内网 / 本地流量：直连 ----------
ip-cidr, 10.0.0.0/8, direct, no-resolve
ip-cidr, 127.0.0.0/8, direct, no-resolve
ip-cidr, 172.16.0.0/12, direct, no-resolve
ip-cidr, 192.168.0.0/16, direct, no-resolve
ip-cidr, 169.254.0.0/16, direct, no-resolve
ip-cidr, 224.0.0.0/4, direct, no-resolve
ip-cidr, 240.0.0.0/4, direct, no-resolve

# ---------- Grok（xAI）：走 AI选择（blackmatrix7 无独立 Grok 规则，手动补充域名）----------
# grok.com = 网页版；x.ai = 官网/API（含 api.x.ai、console.x.ai、accounts.x.ai）
host-suffix, grok.com, AI选择
host-suffix, x.ai, AI选择

# ---------- X（Twitter）平台：走 X平台（默认香港住宅IP，规避风控）----------
# 手动写核心域名，不引用 blackmatrix7 的 Twitter.list（因为那份规则里混入了 grok.com，
# 会导致 grok 被错误分到 X 平台而非 AI 组）。
host-suffix, x.com, X平台
host-suffix, twitter.com, X平台
host-suffix, twimg.com, X平台
host-suffix, twimg.co, X平台
host-suffix, t.co, X平台
host-suffix, twttr.com, X平台
host-suffix, twttr.net, X平台
host-suffix, ads-twitter.com, X平台
host-suffix, cms-twdigitalassets.com, X平台

# ---------- 交易所（Bybit/Bitget/Gate）：走 交易所选择 ----------
# blackmatrix7 仓库无这三家规则，手动写核心域名（类似 X 的做法）。
# 后续在私有仓库建立完整分流后，可改为 filter_remote 引用自己的规则文件。
# --- Bybit ---
host-suffix, bybit.com, 交易所选择
host-suffix, bybitglobal.com, 交易所选择
host-suffix, bybit.nl, 交易所选择
# --- Bitget ---
host-suffix, bitget.com, 交易所选择
host-suffix, bitget.io, 交易所选择
host-suffix, bitget.site, 交易所选择
host-suffix, bitget.cc, 交易所选择
# --- Gate ---
host-suffix, gate.io, 交易所选择
host-suffix, gateio.com, 交易所选择

# ---------- 国内流量：直连 ----------
geoip, cn, direct

# ---------- 兜底：其余外网流量走「兜底分流」----------
final, 兜底分流
