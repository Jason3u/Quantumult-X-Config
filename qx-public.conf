# 修改本配置前，必须先查看同仓库的 CHANGELOG.md（修改日志），
# 了解历次改动与当前策略组状态；每次修改完成后必须在 CHANGELOG.md 追加记录。
# ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

# ============================================================
#  Quantumult X 配置 · Jason3u
#
#  分流总览：
#    Apple 核心（AppStore/iCloud 等）  → direct 直连
#    AI（GPT/Gemini/Claude/Grok）      → 各自独立策略组
#    Telegram 消息                     → Telegram（默认香港节点；App 直连 DC IP，已配 IP 段规则）
#    X（Twitter）                      → X（默认香港自动，住宅优先/无住宅回退香港节点）
#    Binance 币安                      → Binance（默认香港自动：主域直连已被墙，可手动切 direct/友好地区）
#    其他交易所（OKX/Bybit/Bitget/Gate）→ 各自独立策略组（默认香港自动：住宅/香港节点自动选可用）
#    TradingView 行情图表            → TradingView（默认香港自动，可手动切地区）
#    Cornix 自动交易                  → Cornix（默认香港节点，可手动切其他地区）
#    Fomo                            → Fomo（默认 direct 直连，可手动切换地区节点）
#    国际流媒体（Netflix/Disney+/HBO/YouTube/Spotify/TikTok 等）→ InternationalStreaming
#    国内网站                          → direct 直连
#    其余外网                          → 兜底分流
# ============================================================

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
resource_parser_url=https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
no-ipv6
doh-server=https://doh.pub/dns-query
server=223.5.5.5
server=119.29.29.29

[server_remote]
# ⚠️ 含 token，临时测试用，之后移除
# 良心云：QX 原生 vless 格式（无需 opt-parser），含香港住宅IP节点
https://liangxin.xyz/api/v1/liangxin?OwO=08473de9c81c32890fb3c8744ba74b5b, tag=良心云, update-interval=86400, enabled=true
# 吹雪云（暂时停用，保留备用）
# https://xn--9kqs1lo79d.cc/api/v1/chuixue?token=d98c255617661143ccc6753cedaf1a57, tag=吹雪云, update-interval=86400, opt-parser=true, enabled=true

[server_local]
# 留空：本地单节点可在此手动添加

[policy]
# ---------- 节点池：server-tag-regex 按节点名自动筛出，自动测速选延迟最低 ----------
url-latency-benchmark=自动选择, server-tag-regex=.+, check-interval=1200, tolerance=100
url-latency-benchmark=美国节点, server-tag-regex=美国, check-interval=1200, tolerance=100
url-latency-benchmark=日本节点, server-tag-regex=日本, check-interval=1200, tolerance=100
url-latency-benchmark=新加坡节点, server-tag-regex=新加坡, check-interval=1200, tolerance=100
url-latency-benchmark=英国节点, server-tag-regex=英国, check-interval=1200, tolerance=100
url-latency-benchmark=韩国节点, server-tag-regex=韩国, check-interval=1200, tolerance=100
url-latency-benchmark=台湾节点, server-tag-regex=台湾, check-interval=1200, tolerance=100
url-latency-benchmark=香港节点, server-tag-regex=香港, check-interval=1200, tolerance=100
url-latency-benchmark=香港住宅IP, server-tag-regex=住宅, check-interval=1200, tolerance=100

# ---------- 香港自动：正则直接匹配住宅+香港节点，自动选用第一个可用节点 ----------
# 注意：available 官方不支持嵌套策略组，只能用 server-tag-regex 直接匹配节点
available=香港自动, server-tag-regex=住宅|香港

# ---------- 兜底分流：未命中规则的外网流量最终出口（默认香港自动，顺序：香港→台湾→韩国→日本） ----------
static=兜底分流, 香港自动, 台湾节点, 韩国节点, 日本节点

# ---------- AI：每个服务独立策略组（手动选地区，规避 IP 跳变风控） ----------
static=OpenAI, 美国节点, 日本节点, 新加坡节点, 英国节点, 韩国节点, 台湾节点
static=Gemini, 美国节点, 日本节点, 新加坡节点, 英国节点, 韩国节点, 台湾节点
static=Claude, 美国节点, 日本节点, 新加坡节点, 英国节点, 韩国节点, 台湾节点
static=Grok, 美国节点, 日本节点, 新加坡节点, 英国节点, 韩国节点, 台湾节点

# ---------- Telegram：固定具体节点优先；地区测速组作为手动备选 ----------
# TG App 直连 DC IP 不查 DNS，此前无规则匹配、一直掉兜底；专属组后出口固定、可手动钉节点
static=Telegram固定节点, resource-tag-regex=^良心云$, server-tag-regex=香港|日本|新加坡|台湾|韩国|美国
static=Telegram, Telegram固定节点, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点, 美国节点

# ---------- X：默认香港自动（住宅优先，无住宅回退香港节点，可手动切其他地区） ----------
static=X, 香港自动, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- Binance 币安：默认香港自动（2026-09-06 实测主域直连已全被墙，见 CHANGELOG），可手动切 direct/其他地区 ----------
static=Binance, 香港自动, 香港住宅IP, 香港节点, direct, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- OKX 欧易：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
static=OKX, 香港自动, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- Bybit：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
static=Bybit, 香港自动, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- Bitget：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
static=Bitget, 香港自动, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- Gate：默认香港自动（住宅/香港节点自动选可用，可手动强制住宅） ----------
static=Gate, 香港自动, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- TradingView：默认香港自动（住宅/香港节点自动选可用，可手动切地区） ----------
static=TradingView, 香港自动, 香港住宅IP, 香港节点, 日本节点, 新加坡节点, 台湾节点, 韩国节点

# ---------- Cornix：固定具体节点优先；地区测速组作为手动备选 ----------
static=Cornix固定节点, resource-tag-regex=^良心云$, server-tag-regex=香港|日本|新加坡|台湾|韩国|美国
static=Cornix, Cornix固定节点, 香港节点, 新加坡节点, 日本节点, 台湾节点, 韩国节点, 美国节点

# ---------- Fomo：默认 direct 直连，可手动切换地区节点 ----------
# 节点备选顺序不代表 Fomo 官方风控评级；不得用于规避地区限制
static=Fomo, direct, 香港自动, 新加坡节点, 日本节点, 台湾节点, 韩国节点, 英国节点, 美国节点

# ---------- 国际流媒体：默认香港节点，手动备选按风控严重性排序（最严重排最后） ----------
# 排序依据：美区(Netflix/Disney+/Hulu风控最严) > 英国(BBC iPlayer) > 日本(AbemaTV/DMM) > 韩国 > 新加坡 > 台湾
static=InternationalStreaming, 香港节点, 台湾节点, 新加坡节点, 韩国节点, 日本节点, 英国节点, 美国节点

